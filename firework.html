<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireworks</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.5 + 0.5,
    a: Math.random(),
    twinkle: Math.random() * 0.02 + 0.005
  });
}

let particles = [];
let rockets = [];

function randomColor() {
  const hue = Math.random() * 360;
  return { h: hue, hex: `hsl(${hue}, 100%, ${50 + Math.random() * 20}%)` };
}

function launch(x, y) {
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.4;
  const speed = 5 + Math.random() * 4;
  const color = randomColor();
  rockets.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    color,
    trail: [],
    life: 1
  });
}

function explode(r) {
  const count = 60 + Math.floor(Math.random() * 60);
  const { x, y, color } = r;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      hue: color.h + (Math.random() - 0.5) * 40,
      life: 1,
      decay: 0.008 + Math.random() * 0.02,
      r: 1.5 + Math.random() * 2
    });
  }
}

canvas.addEventListener('click', (e) => {
  launch(e.clientX, H);
});

let t = 0;
function animate() {
  t++;
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // Stars
  for (const s of stars) {
    s.a += s.twinkle;
    const alpha = 0.4 + Math.abs(Math.sin(s.a)) * 0.6;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Rockets
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.trail.push({ x: r.x, y: r.y });
    if (r.trail.length > 8) r.trail.shift();
    r.x += r.vx;
    r.y += r.vy;
    r.vy -= 0.05;

    // Draw trail
    for (let j = 1; j < r.trail.length; j++) {
      const p = r.trail[j];
      ctx.globalAlpha = j / r.trail.length * 0.6;
      ctx.strokeStyle = r.color.hex;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r.trail[j - 1].x, r.trail[j - 1].y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    // Draw rocket head
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
    ctx.fill();

    if (r.vy >= 0) {
      explode(r);
      rockets.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.vx *= 0.99;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = p.life;
    ctx.fillStyle = `hsl(${p.hue}, 100%, 60%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
