<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const GROWTH_DURATION = 15000; // 15 seconds
        const MAX_DEPTH = 10;
        const BRANCH_ANGLE = Math.PI / 6;
        const LENGTH_DECAY = 0.7;
        const WIDTH_DECAY = 0.7;

        let startTime = null;
        let branches = [];

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(0.5, '#B0E0E6');
            gradient.addColorStop(1, '#E0F7FA');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function getBranchColor(depth, maxDepth) {
            const brownBase = { r: 139, g: 90, b: 43 };
            const lightness = 1 - (depth / maxDepth) * 0.5;
            return `rgb(${Math.floor(brownBase.r * lightness)}, ${Math.floor(brownBase.g * lightness)}, ${Math.floor(brownBase.b * lightness)})`;
        }

        function getLeafColor() {
            const greens = [
                { r: 34, g: 139, b: 34 },
                { r: 50, g: 205, b: 50 },
                { r: 0, g: 128, b: 0 },
                { r: 107, g: 142, b: 35 },
                { r: 85, g: 107, b: 47 }
            ];
            const color = greens[Math.floor(Math.random() * greens.length)];
            return `rgb(${color.r}, ${color.g}, ${color.b})`;
        }

        function drawBranch(x, y, length, angle, width, depth, progress) {
            const endX = x + Math.cos(angle) * length * progress;
            const endY = y - Math.sin(angle) * length * progress;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = getBranchColor(depth, MAX_DEPTH);
            ctx.lineWidth = width * progress;
            ctx.lineCap = 'round';
            ctx.stroke();

            if (depth < MAX_DEPTH && progress >= 1) {
                const newLength = length * LENGTH_DECAY;
                const newWidth = width * WIDTH_DECAY;
                const leftAngle = angle + BRANCH_ANGLE + (Math.random() - 0.5) * 0.3;
                const rightAngle = angle - BRANCH_ANGLE + (Math.random() - 0.5) * 0.3;

                branches.push({
                    x: endX,
                    y: endY,
                    length: newLength,
                    angle: leftAngle,
                    width: newWidth,
                    depth: depth + 1,
                    startTime: Date.now()
                });

                branches.push({
                    x: endX,
                    y: endY,
                    length: newLength,
                    angle: rightAngle,
                    width: newWidth,
                    depth: depth + 1,
                    startTime: Date.now()
                });
            }

            if (depth === MAX_DEPTH && progress >= 1) {
                const leafSize = 3 + Math.random() * 4;
                ctx.beginPath();
                ctx.arc(endX, endY, leafSize, 0, Math.PI * 2);
                ctx.fillStyle = getLeafColor();
                ctx.fill();
            }
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const globalProgress = Math.min(elapsed / GROWTH_DURATION, 1);

            drawBackground();

            if (branches.length === 0) {
                const trunkLength = canvas.height * 0.25;
                const trunkWidth = 20;
                const startX = canvas.width / 2;
                const startY = canvas.height;

                branches.push({
                    x: startX,
                    y: startY,
                    length: trunkLength,
                    angle: Math.PI / 2,
                    width: trunkWidth,
                    depth: 0,
                    startTime: Date.now()
                });
            }

            const branchesToDraw = [...branches];
            branches = [];

            for (const branch of branchesToDraw) {
                const branchElapsed = Date.now() - branch.startTime;
                const branchProgress = Math.min(branchElapsed / (GROWTH_DURATION / (MAX_DEPTH + 2)), 1);

                if (branchProgress < 1) {
                    branches.push(branch);
                }

                drawBranch(
                    branch.x,
                    branch.y,
                    branch.length,
                    branch.angle,
                    branch.width,
                    branch.depth,
                    branchProgress
                );
            }

            if (globalProgress < 1 || branches.length > 0) {
                requestAnimationFrame(animate);
            }
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
